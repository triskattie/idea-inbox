[project]
name = "idea-inbox"
version = "0.2.0"
description = "Self-hosted idea capture and retrieval assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tris" }]
dependencies = []

[tool.uv]
package = true

[tool.setuptools.package-data]
idea_inbox = ["storage/migrations/*.sql"]

[project.scripts]
idea-inbox = "idea_inbox.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: opt-in integration tests that require a live Postgres server (deselected by default)",
]
addopts = "-m 'not postgres'"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
