[project]
name = "idea-inbox"
version = "0.0.0"
description = "Self-hosted idea capture and retrieval assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tris" }]
dependencies = []

[tool.uv]
package = true

[project.scripts]
idea-inbox = "idea_inbox.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
